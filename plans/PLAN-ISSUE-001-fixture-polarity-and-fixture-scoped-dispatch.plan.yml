             the unchanged v1.1.1 pack reproducibly yields exactly one causal
             `semgrep-positive` phase-3 error under Backstop 0.2.0 from an external working
             directory.
    CLM-002: The declared fixture pair is discriminating under the pack's real declared
             engine and converter: the positive produces ZERO converted SARIF results, and
             the negative produces at least one whose `substantiveness_role` is `hollow`
             and whose ruleId is the rule under test.
    CLM-003: Phase-3 fixture runs are scoped to the fixture rather than the pack tree, and
             the gate path retains the 1.1.1 repo-root walk with an equivalent argv.
    CLM-004: Pack 1.1.2 / ruleset 1.0.1 passes `backstop pack check` and all six
             `backstop pack test` phases from an external working directory against the
             absolute pack path; no tag, push, or consumer lock update is claimed.

