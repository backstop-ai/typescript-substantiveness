  INVOCATION. `backstop pack test` invoked from inside the pack directory, or through any
  relative path, breaks its own macOS sandbox and reports exit-126 convert-script errors
  for everything. Every RED and GREEN reading in this plan comes from an external working
  directory against the ABSOLUTE pack path. An exit-126 reading is an invocation anomaly
  and is never accepted as fixture evidence.

  TWO DEFECTS, NOT ONE. Fixture polarity was inverted, matching the sibling
  typescript-contracts ISSUE-001 repaired today as 1.4.0. Independently, the engine baked
  its root scan target into `command: ast-grep scan --json .`; phase 3 appends the fixture
  path to that same command, so every fixture run walked the whole pack tree with the
  fixture argument inert, and each fixture saw the other fixture's findings. Relabelling
  alone cannot pass phase 3 while the violating example remains anywhere in the walked
  tree, so both had to be fixed together.

  THE CLEAN FIXTURE MUST BE CLEAN OF EVERYTHING. `RunEngine` reports
  `Passed: len(findings) > 0` across the WHOLE converted SARIF, with no filter to the rule
  under test, and `ast-grep/to-sarif.sh` synthesizes a `referenced-symbol` result for every
  (test x import) pair in a file. A substantive test that imported `vitest` would therefore
  still emit findings and read as a false positive. Both fixtures are import-free: `it` is
  a vitest/jest global, so this is idiomatic rather than contrived. Making the NEGATIVE
  import-free is what stops it passing vacuously on a synthesized side-finding.

  GATE PATH MUST NOT REGRESS. The root walk introduced in 1.1.0 -> 1.1.1 for portability is
  preserved by declaring `project_target: "."`, which Backstop appends only on the gate
  path for a project-wide engine that is not `package_scoped`. Argv equivalence against the
  1.1.1 form is proven empirically, not asserted.

  ISSUE-001 carries no CLM identifiers, so this plan defines the local claim ledger:
