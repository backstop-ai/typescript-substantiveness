name: backstop-ai/typescript-substantiveness
version: "1.1.1"
language: typescript
archetype: enforcement
description: >
  TypeScript substantiveness pack — the TS counterpart to backstop/substantiveness
  (Go). Q1 hollow-test rule: an it()/test() call with no assertion-shaped call in its
  callback is hollow (RED). The enclosing test name is emitted in the SARIF result
  `properties.func` (surrounding quotes stripped) so the gate's substantiveness join
  reads a string-named test verbatim (ISSUE-062). The Q2 referenced-symbol/subject
  join is satisfied by co-located test layout (samePackage: a test in the subject's
  directory), idiomatic for TS; a non-co-located referenced-symbol model is future work.
  Classification and the engine scan target are PORTABLE (generic per-language globs /
  repo root) — a pack must never bake a specific consumer's filesystem layout
  (typescript-substantiveness#1: the 1.1.0 harness-baked paths classified zero files on
  every other repo, emitting mass false does-not-call violations).
classification:
  # Portable per-language classification (mirrors backstop-ai/typescript-toolchain):
  # any conventional TS/JS repo classifies without pack edits. A consumer's layout is
  # the consumer's business — the pack declares only what "source" and "test" MEAN.
  source:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"
  test:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.test.jsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/*.spec.js"
    - "**/*.spec.jsx"
    - "**/__tests__/**"
engines:
  ast-grep-substantiveness:
    # Scan the repo root: ast-grep walks the tree honoring ignore files (node_modules
    # etc. stay out via .gitignore); the rules only match test constructs. Never bake
    # consumer paths into the command — scan targets derive from the walk, findings
    # join through the classification globs above.
    command: ast-grep scan --json .
    input_mode: config-file
    input_flag: --config
    scope_kind: project-wide
    category: opinion
    gate_type: substantiveness
    convert: ast-grep/to-sarif.sh
    provision:
      tool: ast-grep
      version: 0.43.0
content:
  ruleset:
    version: 1.0.0
    rules:
      - id: hollow-test-go
        engine: ast-grep-substantiveness
        rule_path: ast-grep/sgconfig.yml
        risk_class: correctness
        claims:
          - id: sub-hollow-test-ts
            text: A TS it()/test() with no assertion-shaped call is hollow (RED finding).
            fixtures:
              positive:
                - testdata/fixtures/rules/hollow-test-ts/positive.ts
              negative:
                - testdata/fixtures/rules/hollow-test-ts/negative.ts
