id: all-test-names-ts
# Q2 support rule: matches EVERY it()/test() declaration (hollow or not), capturing the
# test-name string $FN. The convert pairs each test with its file's imports to synthesize
# the referenced-symbol findings the gate's subject-join reads (TS references its subject
# by importing it, not by a package-qualified call as in Go).
language: typescript
# Callee match (ISSUE-002): a bare `it`/`test`/`effect`, or the dotted form ONLY when
# the receiver is itself `it`/`test` (e.g. `it.effect(...)` from @effect/vitest). The
# 1.1.2 regex `(^|\.)(it|test|effect)$` accepted ANY receiver, so `re.test('x')`
# (RegExp.prototype.test) was read as a test declaration named by its string argument.
# Modifiers such as `test.skip`/`it.only` stay unmatched, as before.
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: "^(it|test|effect)$|^(it|test)\\.(it|test|effect)$" }
    - has: { field: arguments, has: { kind: string, pattern: $FN } }
message: "test $FN"
